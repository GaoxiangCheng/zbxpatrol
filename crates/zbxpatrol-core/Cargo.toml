[package]
name = "zbxpatrol-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "hickory-dns"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
toml = "0.8"
tracing = "0.1"
futures = "0.3"
